AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Saanjh - evening farm-fire detection from GK-2A, smoke forecast and alerts (us-east-1, next to NOAA's bucket)

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email to subscribe to smoke alerts (confirm the email AWS sends).

  FirmsMapKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: NASA FIRMS MAP_KEY, used to mark tonight's fires the polar satellites counted.

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: build/app
    Layers: [!Ref Deps]
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket
        SITE_BUCKET: !Ref SiteBucket
        ALERT_TOPIC_ARN: !Ref AlertTopic
        FIRMS_MAP_KEY: !Ref FirmsMapKey

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
  SiteBucket:
    Type: AWS::S3::Bucket

  Deps:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: build/layer
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]

  # Live path: NOAA publishes every new GK-2A file to this public topic (Lambda/SQS subscribers only).
  LiveQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400
  LiveQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref LiveQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt LiveQueue.Arn
            Condition:
              ArnEquals: {aws:SourceArn: arn:aws:sns:us-east-1:709902155096:NewGK2AObject}
  NoaaSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: arn:aws:sns:us-east-1:709902155096:NewGK2AObject
      Protocol: sqs
      Endpoint: !GetAtt LiveQueue.Arn

  DetectFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.detect_handler
      MemorySize: 2048
      Timeout: 900
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
      Events:
        Live:
          Type: SQS
          Properties:
            Queue: !GetAtt LiveQueue.Arn
            BatchSize: 10  # NOAA posts ~16 files per scan; the handler ignores all but sw038/ir112

  ModelFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.model_handler
      MemorySize: 3008
      Timeout: 900
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - S3CrudPolicy: {BucketName: !Ref SiteBucket}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertTopic.TopicName}
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            # 12:35 IST to 00:35 IST, every hour
            ScheduleExpression: cron(35 7-19 * * ? *)

  AlertTopic:
    Type: AWS::SNS::Topic
  AlertEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Season replay: one Lambda run per day detects every scan in NOAA's archive, then models that day.
  Replay:
    Type: AWS::Serverless::StateMachine
    Properties:
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref DetectFn}
        - LambdaInvokePolicy: {FunctionName: !Ref ModelFn}
      Definition:
        StartAt: Days
        States:
          Days:
            Type: Map
            ItemsPath: $.days
            MaxConcurrency: 8  # new accounts often allow only 10 concurrent Lambda runs
            ItemProcessor:
              StartAt: Detect
              States:
                Detect:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !Ref DetectFn
                    Payload: {"day.$": "$.day", "step_min.$": "$.step_min"}
                  ResultPath: $.detect
                  Retry:
                    - {ErrorEquals: [Lambda.TooManyRequestsException], MaxAttempts: 8, IntervalSeconds: 10, BackoffRate: 2}
                    - {ErrorEquals: [States.ALL], MaxAttempts: 2, IntervalSeconds: 5}
                  Next: Model
                Model:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !Ref ModelFn
                    Payload: {"day.$": "$.day", "replay": true}
                  OutputPath: $.Payload
                  Retry:
                    - {ErrorEquals: [Lambda.TooManyRequestsException], MaxAttempts: 8, IntervalSeconds: 10, BackoffRate: 2}
                    - {ErrorEquals: [States.ALL], MaxAttempts: 2, IntervalSeconds: 30}
                  End: true
            End: true

  # Public page over HTTPS from a Lambda Function URL (new accounts can't create CloudFront until verified).
  SiteFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.site_handler
      MemorySize: 512
      Timeout: 15
      Policies:
        - S3ReadPolicy: {BucketName: !Ref SiteBucket}
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  SiteUrl:
    Value: !GetAtt SiteFnUrl.FunctionUrl
  DataBucket:
    Value: !Ref DataBucket
  SiteBucket:
    Value: !Ref SiteBucket
  ReplayStateMachine:
    Value: !Ref Replay
