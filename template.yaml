AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Saanjh - evening farm-fire detection from GK-2A, smoke forecast and alerts (us-east-1, next to NOAA's bucket)

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email to subscribe to smoke alerts (confirm the email AWS sends).

  OpenAqApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: OpenAQ API key, used by the assistant to read live CPCB PM2.5.
  FirmsMapKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: NASA FIRMS MAP_KEY, used to mark tonight's fires the polar satellites counted.

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: build/app
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket
        SITE_BUCKET: !Ref SiteBucket
        ALERT_TOPIC_ARN: !Ref AlertTopic
        FIRMS_MAP_KEY: !Ref FirmsMapKey

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
  SiteBucket:
    Type: AWS::S3::Bucket

  Deps:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: build/layer
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]

  # Live path: NOAA publishes every new GK-2A file to this public topic (Lambda/SQS subscribers only).
  LiveQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400
      RedrivePolicy:  # a scan that fails 3 times is parked, not retried forever
        deadLetterTargetArn: !GetAtt LiveDLQ.Arn
        maxReceiveCount: 3
  LiveDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  LiveQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref LiveQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: sns.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt LiveQueue.Arn
            Condition:
              ArnEquals: {aws:SourceArn: arn:aws:sns:us-east-1:709902155096:NewGK2AObject}
  NoaaSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: arn:aws:sns:us-east-1:709902155096:NewGK2AObject
      Protocol: sqs
      Endpoint: !GetAtt LiveQueue.Arn

  DetectFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.detect_handler
      Layers: [!Ref Deps]
      MemorySize: 2048
      Timeout: 900
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
      Events:
        Live:
          Type: SQS
          Properties:
            Queue: !GetAtt LiveQueue.Arn
            BatchSize: 10  # NOAA posts ~16 files per scan; the handler ignores all but sw038/ir112

  ModelFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.model_handler
      FunctionName: saanjh-model  # fixed name: the site reads its metrics, and the model links to the site
      Layers: [!Ref Deps]
      MemorySize: 3008
      Timeout: 900
      Environment:
        Variables:
          SITE_URL: !GetAtt SiteFnUrl.FunctionUrl
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - S3CrudPolicy: {BucketName: !Ref SiteBucket}
        - SNSPublishMessagePolicy: {TopicName: !GetAtt AlertTopic.TopicName}
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            # 12:35 IST to 00:35 IST, every hour
            ScheduleExpression: cron(35 7-19 * * ? *)

  # Noon plan: tonight's fire risk and where to send field teams, before the 16:00 IST burning starts.
  PlanFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.plan_handler
      Layers: [!Ref Deps]
      MemorySize: 3008
      Timeout: 600
      Policies:
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - S3CrudPolicy: {BucketName: !Ref SiteBucket}
      Events:
        Noon:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 6 * * ? *)  # 11:30 IST

  AlertTopic:
    Type: AWS::SNS::Topic
  AlertEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Season replay: one Lambda run per day detects every scan in NOAA's archive, then models that day.
  Replay:
    Type: AWS::Serverless::StateMachine
    Properties:
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref DetectFn}
        - LambdaInvokePolicy: {FunctionName: !Ref ModelFn}
      Definition:
        StartAt: Days
        States:
          Days:
            Type: Map
            ItemsPath: $.days
            MaxConcurrency: 8  # new accounts often allow only 10 concurrent Lambda runs
            ItemProcessor:
              StartAt: Detect
              States:
                Detect:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !Ref DetectFn
                    Payload: {"day.$": "$.day", "step_min.$": "$.step_min"}
                  ResultPath: $.detect
                  Retry:
                    - {ErrorEquals: [Lambda.TooManyRequestsException], MaxAttempts: 8, IntervalSeconds: 10, BackoffRate: 2}
                    - {ErrorEquals: [States.ALL], MaxAttempts: 2, IntervalSeconds: 5}
                  Next: Model
                Model:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: !Ref ModelFn
                    Payload: {"day.$": "$.day", "replay": true}
                  OutputPath: $.Payload
                  Retry:
                    - {ErrorEquals: [Lambda.TooManyRequestsException], MaxAttempts: 8, IntervalSeconds: 10, BackoffRate: 2}
                    - {ErrorEquals: [States.ALL], MaxAttempts: 2, IntervalSeconds: 30}
                  End: true
            End: true

  # Public page over HTTPS from a Lambda Function URL (new accounts can't create CloudFront until verified).
  SiteFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.aws.site_handler
      Layers: [!Ref Deps]
      MemorySize: 512
      Timeout: 15
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cloudwatch:GetMetricData, cloudwatch:DescribeAlarms]
              Resource: "*"
        - S3ReadPolicy: {BucketName: !Ref SiteBucket}
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          AGENT_URL: !GetAtt AgentFnUrl.FunctionUrl
          DETECT_FN: !Ref DetectFn
          MODEL_FN: saanjh-model
          PLAN_FN: !Ref PlanFn
          AGENT_FN: !Ref AgentFn

  AgentDeps:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: build/agent_layer
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]

  # "Ask Saanjh": a Strands agent on Bedrock (open-weight Qwen3 via the Mantle endpoint, Free-plan friendly)
  # that explains tonight's ranking from the published data.
  AgentFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: saanjh.agent.ask_handler
      Layers: [!Ref AgentDeps]
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          OPENAQ_API_KEY: !Ref OpenAqApiKey
          AGENT_MODEL_ID: qwen.qwen3-235b-a22b-2507
      Policies:
        - S3ReadPolicy: {BucketName: !Ref SiteBucket}
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            # Bedrock's OpenAI-compatible (Mantle) endpoint, via short-term tokens minted from this role.
            - Effect: Allow
              Action: [bedrock-mantle:CreateInference, bedrock-mantle:CallWithBearerToken]
              Resource: "*"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]


  # Operations: ops alerts go to their own topic, never to the public smoke alerts.
  OpsTopic:
    Type: AWS::SNS::Topic
  OpsEmailSub:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref OpsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  DetectErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saanjh-detect-errors
      AlarmDescription: The detection Lambda raised errors in the last 15 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref DetectFn}]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  ModelErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saanjh-model-errors
      AlarmDescription: The hourly smoke model failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ModelFn}]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  PipelineLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saanjh-pipeline-lag
      AlarmDescription: Images are being processed more than 45 minutes after they were taken.
      Namespace: Saanjh
      MetricName: ScanLatency
      Dimensions: [{Name: Stage, Value: live}]
      ExtendedStatistic: p50
      Period: 900
      EvaluationPeriods: 3
      Threshold: 2700
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saanjh-queue-backlog
      AlarmDescription: NOAA notifications are waiting in the queue for over 30 minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt LiveQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1800
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: saanjh-failed-images
      AlarmDescription: An image failed three times and was parked in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt LiveDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsTopic]
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: saanjh
      DashboardBody: !Sub |
        {"widgets": [
          {"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{"title":"GK-2A images processed / hour","region":"${AWS::Region}","stat":"Sum","period":3600,"metrics":[["Saanjh","ScansProcessed","Stage","live"]]}},
          {"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{"title":"Image-to-detection latency (s)","region":"${AWS::Region}","period":900,"metrics":[["Saanjh","ScanLatency","Stage","live",{"stat":"p50"}],["...",{"stat":"p90"}]]}},
          {"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{"title":"Fire detections / hour","region":"${AWS::Region}","stat":"Sum","period":3600,"metrics":[["Saanjh","Detections","Stage","live"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda duration p90 (ms)","region":"${AWS::Region}","stat":"p90","period":900,"metrics":[["AWS/Lambda","Duration","FunctionName","${DetectFn}"],["...","${ModelFn}"],["...","${PlanFn}"],["...","${AgentFn}"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Lambda errors and throttles","region":"${AWS::Region}","stat":"Sum","period":900,"metrics":[["AWS/Lambda","Errors","FunctionName","${DetectFn}"],["...","${ModelFn}"],["AWS/Lambda","Throttles","FunctionName","${DetectFn}"]]}},
          {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Live queue: oldest message (s) and dead letters","region":"${AWS::Region}","stat":"Maximum","period":300,"metrics":[["AWS/SQS","ApproximateAgeOfOldestMessage","QueueName","${LiveQueue.QueueName}"],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${LiveDLQ.QueueName}"]]}},
          {"type":"alarm","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Alarms","alarms":["${DetectErrorsAlarm.Arn}","${ModelErrorsAlarm.Arn}","${PipelineLagAlarm.Arn}","${QueueBacklogAlarm.Arn}","${DeadLetterAlarm.Arn}"]}}
        ]}

Outputs:
  SiteUrl:
    Value: !GetAtt SiteFnUrl.FunctionUrl
  DataBucket:
    Value: !Ref DataBucket
  SiteBucket:
    Value: !Ref SiteBucket
  ReplayStateMachine:
    Value: !Ref Replay
  AgentUrl:
    Value: !GetAtt AgentFnUrl.FunctionUrl
  Dashboard:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=saanjh"
