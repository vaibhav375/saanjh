name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt aws-sam-cli
      - name: Tests (geolocation, detector, tree export, planner, handlers on mocked AWS, page script)
        run: python -m pytest -q
      - name: Lint the AWS SAM template
        run: sam validate --lint --region us-east-1
      - name: OpenAPI spec parses
        run: python -c "import yaml; yaml.safe_load(open('site/openapi.yaml')); print('ok')"
